name: gates

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  live-eval:
    name: live-eval
    # Evaluate PRs and releases; avoid a duplicate paid run after merging.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse secretless fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Fork PRs require a reviewed same-repository branch and passing live evaluation before merge.'
          exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
      - run: node scripts/verify-eval.mjs
      - run: docker build -t leetkob-sandbox:pa3 sandbox
      - name: Generate fresh model predictions and enforce both evaluations
        env:
          MODEL_OFF: '0'
          MODEL_NAME: gemini-3.5-flash-lite
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: node scripts/run-live-eval.mjs eval/runs/local-live-eval
      - name: Preserve predictions, provider audit, metrics and cost even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/runs/local-live-eval/
          if-no-files-found: warn

  gates:
    name: gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pa2
          POSTGRES_PASSWORD: pa2
          POSTGRES_DB: pa2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pa2 -d pa2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pa2:pa2@localhost:5432/pa2_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/check-go-format.mjs
      - run: node --test scripts/*.test.mjs
      - run: node scripts/verify-eval.mjs
      - run: go -C backend vet ./...
      - run: go -C backend test ./... -count=1 -v
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend

  security:
    name: secret-history
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The standalone MIT-licensed CLI does not need the Action's license key.
      - name: Install Gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: gitleaks git --log-opts="--all" --redact --exit-code=1 .
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run e2e --prefix frontend

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pa3
          POSTGRES_PASSWORD: pa3
          POSTGRES_DB: pa3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pa3 -d pa3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pa3:pa3@localhost:5432/pa3_test?sslmode=disable
      SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: docker build -t leetkob-sandbox:pa3 sandbox
      - run: go -C backend test ./... -count=1 -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
      - run: docker build -f deploy/Dockerfile.checker -t leetkob-checker:pa3 .
      - run: node scripts/verify-extra.mjs
      - name: Offline contracts and ban accuracy (semantic work stays unsure)
        run: |
          node scripts/run-offline-eval.mjs eval/official /tmp/leetkob-official
          node scripts/run-offline-eval.mjs eval/extra /tmp/leetkob-extra
